name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

      - name: Integration test - list
        run: cargo run -- list --path test-mods

      - name: Integration test - resolve
        run: cargo run -- resolve --path test-mods

      - name: Integration test - check
        run: cargo run -- check --path test-mods
        continue-on-error: true

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt -- --check

  registry-test:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Download real Horizon mods
        run: |
          mkdir -p test-real-mods
          cd test-real-mods
          curl -sL "https://github.com/horizon-rust/horizon-mods/releases/latest/download/freecam-0.1.0.hnmod" -o freecam.hnmod || true
          curl -sL "https://github.com/horizon-rust/horizon-mods/releases/latest/download/basic_hud-0.1.0.hnmod" -o basic_hud.hnmod || true
          curl -sL "https://github.com/horizon-rust/horizon-mods/releases/latest/download/mod_menu-0.3.0.hnmod" -o mod_menu.hnmod || true

      - name: Test against real registry mods
        run: |
          for mod in test-real-mods/*.hnmod; do
            [ -f "$mod" ] || continue
            dir="${mod%.hnmod}"
            mkdir -p "$dir"
            unzip -q "$mod" -d "$dir"
          done
          cargo run -- list --path test-real-mods
          cargo run -- resolve --path test-real-mods
