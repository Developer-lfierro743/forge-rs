name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build forge-rs CLI
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

      - name: Verify CLI help
        run: cargo run -- --help

      - name: Test init command
        run: |
          mkdir -p /tmp/test-init-ci
          cargo run -- init test_mod --path /tmp/test-init-ci --force
          test -f /tmp/test-init-ci/test_mod/horizon-mixin.toml

      - name: Verify manifest parsing
        run: |
          cargo run -- list --path /tmp/test-init-ci

      - name: Test registry client (with retry)
        run: |
          for i in 1 2 3; do
            cargo run -- registry list && break || sleep 5
          done

      - name: Test search
        run: |
          for i in 1 2 3; do
            cargo run -- registry search hud && break || sleep 5
          done

      - name: Test pack command
        run: |
          mkdir -p /tmp/test-pack-ci/mods/testmod
          cat > /tmp/test-pack-ci/modpack.toml << 'MODEOF'
          id = "test_pack"
          name = "Test Pack"
          version = "1.0.0"

          [[mods]]
          id = "testmod"
          version = "0.1.0"
          source = "mods/testmod"
          path = "mods/testmod"
          MODEOF
          echo "test" > /tmp/test-pack-ci/mods/testmod/mod.rs
          cargo run -- pack /tmp/test-pack-ci --output /tmp/test.fpack --force

      - name: Test mods install
        run: |
          mkdir -p /tmp/test-mods-ci
          echo "test" > /tmp/test-mods-ci/test_mod.hnmod
          cargo run -- mods install /tmp/test-mods-ci/test_mod.hnmod --path /tmp/test-mods-install
          test -f /tmp/test-mods-install/enabled/test_mod.hnmod

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt -- --check
