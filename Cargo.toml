[package]
name = "forge-rs"
version = "0.1.0"
edition = "2024"

[lib]
name = "forge_rs"
path = "src/lib.rs"

[[bin]]
name = "forge-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
indicatif = "0.18.6"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
toml = "1.2.0"
zip = { version = "9.3.0", features = ["deflate"] }
regex = "1.10"
