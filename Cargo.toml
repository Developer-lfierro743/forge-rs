[package]
name = "forge-rs"
version = "0.1.0"
edition = "2024"

[lib]
name = "forge_rs"
path = "src/lib.rs"

[[bin]]
name = "forge-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
indicatif = "0.18.6"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.2.0"
